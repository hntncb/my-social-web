name: Run Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: |
          test -n "$POSTGRES_USER" || (echo "POSTGRES_USER is missing" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "POSTGRES_PASSWORD is missing" && exit 1)
          test -n "$POSTGRES_DB" || (echo "POSTGRES_DB is missing" && exit 1)
          test -n "$JWT_SECRET" || (echo "JWT_SECRET is missing" && exit 1)
          test -n "$JWT_EXPIRES_IN" || (echo "JWT_EXPIRES_IN is missing" && exit 1)
          echo "All required secrets are present."

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests via Docker
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: docker compose --profile test run --rm api-test npm run test:integration:internal

      - name: Debug Docker
        if: always()
        run: |
          docker ps -a

          echo "===== postgres-node-test ====="
          docker logs postgres-node-test || true

          echo "===== node-api-test ====="
          docker logs node-api-test || true
